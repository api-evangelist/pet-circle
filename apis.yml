aid: pet-circle
name: Pet Circle
description: 'Pet Circle is Australia''s largest online pet-supplies retailer, selling
  pet food, flea and worming treatments, toys, bedding and prescription veterinary
  products direct to consumers across Australia. Founded in mid-2011 in Sydney by
  Mike Frizell and James Edwards as Paws for Life and rebranded to Pet Circle in early
  2014, the company reached unicorn status with a valuation above AU$1 billion after
  a $125 million Series C in December 2021, and extended into adjacent lines with
  Pet Circle Pharmacy (petcirclepharma.com.au) and Pet Circle Insurance (petcircleinsurance.com.au,
  launched May 2023). Its storefront is a headless commerce stack — a commercetools
  back end fronted by a Vue Storefront / Alokai layer on Vercel, with Google Cloud
  Functions gluing SaaS services together — but Pet Circle operates that architecture
  internally: it publishes no public developer portal, no API reference, and no
  machine-readable API contract. Trading-partner integration is handled out of band
  through EDI, and consumer-side partner traffic runs through third-party affiliate
  networks rather than a first-party API program.'
